<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>rPPG CHECK</title>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      margin: 0;
      padding: 24px;
      background: #f5f7fa;
      color: #222;
      text-align: center;
    }

    h1 {
      margin-top: 20px;
      font-size: 32px;
    }

    p {
      font-size: 17px;
      line-height: 1.6;
    }

    button {
      margin-top: 20px;
      padding: 16px 28px;
      font-size: 18px;
      font-weight: bold;
      border: none;
      border-radius: 12px;
      background: #111;
      color: white;
    }

    #videoWrap {
      position: relative;
      width: 100%;
      max-width: 420px;
      margin: 24px auto 0;
      display: none;
      touch-action: none;
    }

    video {
      width: 100%;
      border-radius: 16px;
      background: #000;
      transform: scaleX(-1);
      display: block;
    }

    #roi {
      position: absolute;
      left: 38%;
      top: 20%;
      width: 24%;
      height: 9%;
      border: 3px solid white;
      border-radius: 10px;
      box-sizing: border-box;
      cursor: grab;
      touch-action: none;
      background: rgba(255,255,255,0.08);
    }

    #roi::after {
      content: "額に移動";
      position: absolute;
      left: 50%;
      top: -28px;
      transform: translateX(-50%);
      white-space: nowrap;
      font-size: 13px;
      font-weight: bold;
      color: white;
      background: rgba(0,0,0,0.55);
      padding: 3px 7px;
      border-radius: 6px;
    }

    #status {
      margin-top: 18px;
      font-size: 16px;
    }

    #rgbBox {
      display: none;
      max-width: 420px;
      margin: 20px auto;
      padding: 18px;
      background: white;
      border-radius: 16px;
    }

    .rgb {
      font-size: 20px;
      font-weight: bold;
      line-height: 1.8;
    }

    #note {
      font-size: 14px;
      color: #666;
    }

    canvas {
      display: none;
    }
  </style>
</head>

<body>

  <h1>rPPG CHECK</h1>

  <p>簡易コンディション測定 Ver.3.2</p>

  <p>
    白い枠を指で動かし、<br>
    額中央の皮膚に合わせてください。
  </p>

  <button id="startButton">カメラを起動</button>

  <p id="status">カメラはまだ起動していません。</p>

  <div id="videoWrap">
    <video id="video" autoplay playsinline muted></video>
    <div id="roi"></div>
  </div>

  <div id="rgbBox">
    <div class="rgb">
      R：<span id="rValue">---</span><br>
      G：<span id="gValue">---</span><br>
      B：<span id="bValue">---</span>
    </div>

    <p id="note">
      現在の白枠内の平均RGB値を表示しています。
    </p>
  </div>

  <canvas id="canvas"></canvas>

  <script>
    const startButton = document.getElementById("startButton");
    const video = document.getElementById("video");
    const videoWrap = document.getElementById("videoWrap");
    const roi = document.getElementById("roi");
    const status = document.getElementById("status");
    const rgbBox = document.getElementById("rgbBox");

    const rValue = document.getElementById("rValue");
    const gValue = document.getElementById("gValue");
    const bValue = document.getElementById("bValue");

    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d", {
      willReadFrequently: true
    });

    let timer = null;

    let dragging = false;
    let offsetX = 0;
    let offsetY = 0;

    startButton.addEventListener("click", async () => {
      try {
        status.textContent = "カメラを起動しています…";

        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: "user"
          },
          audio: false
        });

        video.srcObject = stream;

        videoWrap.style.display = "block";
        rgbBox.style.display = "block";

        startButton.textContent = "カメラ起動済み";
        startButton.disabled = true;

        video.addEventListener("loadedmetadata", () => {
          canvas.width = video.videoWidth;
          canvas.height = video.videoHeight;

          status.textContent =
            "白い枠を額中央へ動かしてください。";

          startRGBReading();

        }, { once: true });

      } catch (error) {
        console.error(error);

        status.textContent =
          "カメラを起動できませんでした。カメラの使用を許可してください。";
      }
    });

    roi.addEventListener("pointerdown", (event) => {
      dragging = true;

      const roiRect = roi.getBoundingClientRect();

      offsetX = event.clientX - roiRect.left;
      offsetY = event.clientY - roiRect.top;

      roi.setPointerCapture(event.pointerId);
    });

    roi.addEventListener("pointermove", (event) => {
      if (!dragging) return;

      const wrapRect = videoWrap.getBoundingClientRect();

      let newX =
        event.clientX - wrapRect.left - offsetX;

      let newY =
        event.clientY - wrapRect.top - offsetY;

      const maxX =
        videoWrap.clientWidth - roi.offsetWidth;

      const maxY =
        videoWrap.clientHeight - roi.offsetHeight;

      newX = Math.max(0, Math.min(newX, maxX));
      newY = Math.max(0, Math.min(newY, maxY));

      roi.style.left =
        (newX / videoWrap.clientWidth * 100) + "%";

      roi.style.top =
        (newY / videoWrap.clientHeight * 100) + "%";
    });

    roi.addEventListener("pointerup", () => {
      dragging = false;

      status.textContent =
        "現在の白枠内から色データを取得しています。";
    });

    roi.addEventListener("pointercancel", () => {
      dragging = false;
    });

    function startRGBReading() {
      if (timer) {
        clearInterval(timer);
      }

      timer = setInterval(() => {
        if (
          video.readyState < 2 ||
          video.videoWidth === 0 ||
          video.videoHeight === 0
        ) {
          return;
        }

        ctx.drawImage(
          video,
          0,
          0,
          canvas.width,
          canvas.height
        );

        const videoRect = video.getBoundingClientRect();
        const roiRect = roi.getBoundingClientRect();

        const displayX =
          (roiRect.left - videoRect.left) /
          videoRect.width;

        const displayY =
          (roiRect.top - videoRect.top) /
          videoRect.height;

        const displayW =
          roiRect.width /
          videoRect.width;

        const displayH =
          roiRect.height /
          videoRect.height;

        /*
          プレビュー映像は左右反転しているため、
          Canvas側のX座標だけ反転して対応させます。
        */
        const sourceX =
          1 - displayX - displayW;

        let roiX =
          Math.floor(sourceX * canvas.width);

        let roiY =
          Math.floor(displayY * canvas.height);

        let roiW =
          Math.floor(displayW * canvas.width);

        let roiH =
          Math.floor(displayH * canvas.height);

        roiX = Math.max(0, roiX);
        roiY = Math.max(0, roiY);

        roiW = Math.min(
          roiW,
          canvas.width - roiX
        );

        roiH = Math.min(
          roiH,
          canvas.height - roiY
        );

        if (roiW <= 0 || roiH <= 0) return;

        const imageData = ctx.getImageData(
          roiX,
          roiY,
          roiW,
          roiH
        );

        const data = imageData.data;

        let r = 0;
        let g = 0;
        let b = 0;
        let count = 0;

        for (
          let i = 0;
          i < data.length;
          i += 16
        ) {
          r += data[i];
          g += data[i + 1];
          b += data[i + 2];
          count++;
        }

        if (count > 0) {
          rValue.textContent =
            (r / count).toFixed(1);

          gValue.textContent =
            (g / count).toFixed(1);

          bValue.textContent =
            (b / count).toFixed(1);
        }

      }, 200);
    }
  </script>

</body>
</html>
